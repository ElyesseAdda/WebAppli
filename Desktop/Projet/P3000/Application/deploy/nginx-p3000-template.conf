# Configuration Nginx pour P3000
# Remplacer:
# - myp3000app.com par votre domaine
# - /var/www/p3000/... par votre chemin

# Limite de taux pour la sécurité
limit_req_zone $binary_remote_addr zone=p3000_limit:10m rate=10r/s;

# Upstream Gunicorn
upstream p3000_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name myp3000app.com www.myp3000app.com;

    # Logs
    access_log /var/log/nginx/p3000_access.log;
    error_log /var/log/nginx/p3000_error.log;

    # Taille maximale des uploads
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Fichiers statiques
    location /static/ {
        alias /var/www/p3000/Desktop/Projet/P3000/Application/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fichiers media (si utilisés localement)
    location /media/ {
        alias /var/www/p3000/Desktop/Projet/P3000/Application/media/;
        expires 7d;
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux fichiers de backup
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Application Django
    location / {
        # Rate limiting
        limit_req zone=p3000_limit burst=20 nodelay;

        # Proxy vers Gunicorn
        proxy_pass http://p3000_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Healthcheck
    location /healthcheck {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
